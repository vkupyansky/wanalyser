[project]
name = "wanalyser"
version = "0.1.0"
description = "Telegram-бот для поиска цен и подписок Warframe Market"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "aiohttp==3.14.5",
  "psycopg[binary]==3.3.8",
  "redis==7.4.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "pip-audit==2.10.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
extend-exclude = ["database_dumps"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
